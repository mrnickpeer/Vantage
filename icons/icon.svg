<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="v_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <filter id="glow_1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#bg_1)"/>
  
  <!-- Subtle inner glowing ring -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="url(#v_gradient)" stroke-width="2" opacity="0.3"/>

  <!-- Bold, ultra-modern fluid 'V' representing Vantage and Nodes -->
  <path d="M 36 44 L 64 86 L 92 44" fill="none" stroke="url(#v_gradient)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow_1)"/>

  <!-- Floating interconnected node (radar ping) -->
  <circle cx="64" cy="44" r="6" fill="#ffffff" filter="url(#glow_1)"/>
</svg>
